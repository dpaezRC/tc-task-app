services:
  postgres:
    image: postgres:17-alpine
    volumes:
      - ${PWD}/.docker/postgres:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasks-app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
